[project]
name = "cluster-manager"
version = "0.1.0"
requires-python = ">=3.10.13"
dependencies = [
    "apscheduler>=3.11.3",
    "eventlet==0.33.3",
    "flask~=2.1.1",
    "flask-cors>=6.0.5",
    "flask-pymongo==2.3.0",
    "flask-smorest==0.39.0",
    "flask-socketio==4.3.1",
    "flask-swagger-ui>=5.32.8",
    "grpcio~=1.75.1",
    "grpcio-tools~=1.75.1",
    "gunicorn==22.0.0",
    "marshmallow~=3.15.0",
    "paho-mqtt==1.6.1",
    "prometheus-client>=0.25.0",
    "protobuf>=4.25.2,<7.0.0",
    "pyyaml>=6.0.3",
    "requests>=2.27.1",
    "werkzeug==2.0.3",
    "oakestra-utils",
    "resource-abstractor-client",
    "typing-extensions>=4.16.0",
    "pydantic>=2.13.4",
]

[tool.uv.sources]
oakestra-utils = { path = "../../libraries/oakestra_utils_library" }
resource-abstractor-client = { path = "../../libraries/resource_abstractor_client" }
